<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f87918">
    <title>FoxBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <main>
            <h1 id="page-title">FoxBox</h1>
            <section class="box-stage" aria-labelledby="composer-title">
                <div id="bubble-container" class="bubble-container">
                    <div class="empty" id="empty-queue">Add something to let it float.</div>
                </div>
                <div class="composer" aria-label="Add a payload">
                    <p class="eyebrow" id="composer-title">Drop zone</p>
                    <h2>Send something up</h2>
                    <p>Type or paste text, then add it to your floating box.</p>
                    <form class="search-box-group" id="share-form">
                        <input type="text" id="share-input" class="search-input" placeholder="Paste a link or type a message..." autocomplete="off">
                        <button type="submit" id="add-btn" class="search-btn">Add</button>
                    </form>
                    <div id="receiver-output" class="radar-output"><span class="radar-pulse"></span><span>Ready to beam</span></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
