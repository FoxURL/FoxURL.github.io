<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FoxURL</title>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #101820;
            --card-bg: rgba(22, 32, 38, 0.92);
            --text-main: #f8fafc;
            --text-muted: #a7b2b9;
            --accent: #ff6600;
            --accent-hover: #e65c00;
            --border: rgba(255, 255, 255, 0.12);
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 12% 10%, rgba(255, 102, 0, 0.18), transparent 30%), linear-gradient(145deg, #101820 0%, #17232a 52%, #0b1115 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 102, 0, 0.08);
            box-sizing: border-box;
            text-align: center;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 25px;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(255, 102, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .btn-auth {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .btn-auth:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 102, 0, 0.2);
        }

        .btn-passkey {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-passkey:hover {
            background-color: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 16px 0;
            color: var(--text-muted);
            font-size: 13px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 18px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-mark" aria-hidden="true">F</div>
        <h2>Welcome to FoxURL</h2>
        <p class="subtitle">Choose your preferred sign-in method.</p>
        
        <div id="hub-alert" class="alert alert-error"></div>

        <!-- Option 1: Email Code Login -->
        <a href="/login/email/" class="btn-auth">Continue with Email Code</a>

        <!-- Option 2: Passkey Biometric Login -->
        <a href="/login/passkey/" class="btn-auth btn-passkey">Sign In with Passkey</a>

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Option 3: Google Sign-In Button Container -->
        <div id="g_id_onload"
             data-client_id="293011781658-ehl0tb8kd6knljmhoj83gb688gcm4b7v.apps.googleusercontent.com"
             data-callback="handleGoogleSignIn"
             data-auto_prompt="false">
        </div>
        
        <div class="google-btn-wrapper">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-text="sign_in_with"
                 data-size="large"
                 data-width="320">
            </div>
        </div>
    </div>

    <script>
        // Handle Google Sign-In Response callback directly from the hub if desired
        function handleGoogleSignIn(response) {
            const alertBox = document.getElementById('hub-alert');
            alertBox.style.display = 'none';

            const payload = parseJwt(response.credential);
            saveVerifiedEmail(payload.email);
            localStorage.setItem('foxurl.signin.method', 'google');
            localStorage.setItem('foxurl.signin.lastLogin', new Date().toISOString());
            const googleName = payload.name;

            alertBox.className = 'alert alert-success';
            alertBox.textContent = `Welcome, ${googleName}! Redirecting...`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = '/';
            }, 1200);
        }

        function saveVerifiedEmail(email) {
            if (typeof email === 'string' && email.includes('@')) {
                localStorage.setItem('foxurl.signin.email', email.trim());
            }
        }

        // Helper function to decode JWT token
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
