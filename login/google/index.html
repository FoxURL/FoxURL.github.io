<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In with Google - FoxURL</title>
    <!-- Google Identity Services Library -->
    <script id="google-identity-services" src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #101820;
            --card-bg: rgba(22, 32, 38, 0.92);
            --text-main: #f8fafc;
            --text-muted: #a7b2b9;
            --accent: #ff6600;
            --accent-hover: #e65c00;
            --border: rgba(255, 255, 255, 0.12);
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 12% 10%, rgba(255, 102, 0, 0.18), transparent 30%), linear-gradient(145deg, #101820 0%, #17232a 52%, #0b1115 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 102, 0, 0.08);
            box-sizing: border-box;
            text-align: center;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 25px;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(255, 102, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 18px;
                padding: 32px 24px;
            }
        }

        .back-link {
            margin-top: 24px;
            font-size: 14px;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .auth-container {
            border-color: rgba(255, 255, 255, 0.16);
            background: linear-gradient(155deg, rgba(28, 40, 47, 0.97), rgba(15, 23, 28, 0.97));
            backdrop-filter: blur(18px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #ffb36b;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h2 {
            letter-spacing: -0.035em;
        }

        p.subtitle {
            line-height: 1.6;
        }

        .google-btn-wrapper {
            min-height: 40px;
            margin-top: 24px;
        }

        .back-link a:focus-visible {
            outline: 3px solid #ffb36b;
            outline-offset: 3px;
        }
    </style>
    <link rel="stylesheet" href="../auth.css">
</head>
<body>

    <div class="auth-container">
        <a class="brand-mark" href="/" aria-label="FoxURL home">
            <img src="../../assets/logo/logo.png" alt="FoxURL">
        </a>
        <div class="provider-mark provider-mark-google" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.5 9.5 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 1.9-6.9 1.9-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.6 27.5a12 12 0 0 1 0-7v-5.3H5.8a20 20 0 0 0 0 17.6l6.8-5.3Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20 20 0 0 0 5.8 15.2l6.8 5.3c1.6-4.8 6.1-8.4 11.4-8.4Z"/></svg>
        </div>
        <p class="eyebrow">Secure account access</p>
        <h2>Sign in to FoxURL</h2>
        <p class="subtitle">Use your Google account to verify and sign in instantly.</p>
        
        <div id="google-alert" class="alert alert-error" role="status" aria-live="polite"></div>

        <div class="google-btn-wrapper">
            <div id="google-button-container"></div>
        </div>

        <div class="back-link">
            <p><a href="/login/">Back to sign in options</a></p>
        </div>
    </div>

    <script>
        // Google Apps Script Web App Deployment URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQ6IZPgWFkQO5pJzAYzPHvkoi4fgwnt7rwdj5C5YPw9cQWiCw5y94EpLhj6dAAPY_c/exec";
        
        let clientIp = "Unknown IP";
        let clientLocation = "Unknown Location";
        let clientDevice = parseDeviceInfo();

        // Parse user agent for OS and Browser info
        function parseDeviceInfo() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            let browser = "Unknown Browser";

            if (/windows nt/i.test(ua)) os = "Windows";
            else if (/macintosh|mac os x/i.test(ua)) os = "Mac OS";
            else if (/iphone|ipad|ipod/i.test(ua)) os = "iOS";
            else if (/android/i.test(ua)) os = "Android";
            else if (/linux/i.test(ua)) os = "Linux";

            if (/chrome|crios/i.test(ua) && !/edge|opr/i.test(ua)) browser = "Chrome";
            else if (/safari/i.test(ua) && !/chrome|crios/i.test(ua)) browser = "Safari";
            else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
            else if (/edge/i.test(ua)) browser = "Edge";
            else if (/opr|opera/i.test(ua)) browser = "Opera";

            return `${os} / ${browser}`;
        }

        // Fetch user IP and general location
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data.ip) clientIp = data.ip;
                if (data.city && data.country_name) {
                    clientLocation = `${data.city}, ${data.country_name}`;
                } else if (data.country_name) {
                    clientLocation = data.country_name;
                }
            })
            .catch(() => {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => { clientIp = data.ip; })
                    .catch(() => {});
            });

        // Handle Google Sign-In Response callback
        function handleGoogleSignIn(response) {
            const alertBox = document.getElementById('google-alert');
            alertBox.style.display = 'none';

            // Decode the JWT token payload from Google
            const payload = parseJwt(response.credential);
            const googleEmail = payload.email;
            const googleName = payload.name;
            saveVerifiedEmail(googleEmail);
            localStorage.setItem('foxurl.signin.method', 'google');
            localStorage.setItem('foxurl.signin.lastLogin', new Date().toISOString());

            // Optional: send to Apps Script backend to record login metrics / audit trail
            const url = `${SCRIPT_URL}?action=google_login&email=${encodeURIComponent(googleEmail)}&name=${encodeURIComponent(googleName)}&ip=${encodeURIComponent(clientIp)}&location=${encodeURIComponent(clientLocation)}&device=${encodeURIComponent(clientDevice)}`;

            fetch(url).catch(() => {});

            // Show success message and redirect user home
            alertBox.className = 'alert alert-success';
            alertBox.textContent = `Welcome, ${googleName}! Redirecting...`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = '/';
            }, 1200);
        }

        function saveVerifiedEmail(email) {
            if (typeof email === 'string' && email.includes('@')) {
                localStorage.setItem('foxurl.signin.email', email.trim());
            }
        }

        // Helper function to decode JWT token
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        let googleButtonInitialized = false;
        let googleButtonWidth = 0;
        let googleButtonResizeTimer;

        function renderGoogleButton() {
            const googleIdentity = window.google && window.google.accounts && window.google.accounts.id;
            const buttonContainer = document.getElementById('google-button-container');
            if (!googleIdentity || !buttonContainer) return;

            const width = Math.floor(buttonContainer.getBoundingClientRect().width);
            if (!width || width === googleButtonWidth) return;

            if (!googleButtonInitialized) {
                googleIdentity.initialize({
                    client_id: '293011781658-ehl0tb8kd6knljmhoj83gb688gcm4b7v.apps.googleusercontent.com',
                    callback: handleGoogleSignIn,
                    auto_select: false
                });
                googleButtonInitialized = true;
            }

            buttonContainer.replaceChildren();
            googleIdentity.renderButton(buttonContainer, {
                type: 'standard',
                shape: 'rectangular',
                theme: 'outline',
                text: 'continue_with',
                size: 'large',
                logo_alignment: 'left',
                width
            });
            googleButtonWidth = width;
        }

        document.getElementById('google-identity-services').addEventListener('load', renderGoogleButton, { once: true });
        window.addEventListener('resize', () => {
            window.clearTimeout(googleButtonResizeTimer);
            googleButtonResizeTimer = window.setTimeout(renderGoogleButton, 120);
        });
        renderGoogleButton();
    </script>
</body>
</html>
