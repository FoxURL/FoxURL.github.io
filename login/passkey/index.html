<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passkey Sign-In - FoxURL</title>
    <style>
        :root {
            --bg-color: #101820;
            --card-bg: rgba(22, 32, 38, 0.92);
            --text-main: #f8fafc;
            --text-muted: #a7b2b9;
            --accent: #ff6600;
            --accent-hover: #e65c00;
            --border: rgba(255, 255, 255, 0.12);
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 12% 10%, rgba(255, 102, 0, 0.18), transparent 30%), linear-gradient(145deg, #101820 0%, #17232a 52%, #0b1115 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 102, 0, 0.08);
            box-sizing: border-box;
            text-align: center;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 25px;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(255, 102, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .btn-passkey {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
        }

        .btn-passkey:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(255, 102, 0, 0.2);
        }

        .btn-passkey:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-link {
            margin-top: 20px;
            font-size: 14px;
        }

        .back-link a {
            color: var(--accent);
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 18px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-mark" aria-hidden="true">F</div>
        <h2>Passkey Authentication</h2>
        <p class="subtitle">Sign in securely using your device biometrics or hardware key.</p>
        
        <div id="passkey-alert" class="alert alert-error"></div>

        <button id="auth-btn" class="btn-passkey" onclick="handlePasskeyLogin()">Sign In with Passkey</button>

        <div class="back-link">
            <p><a href="/login/">Back to sign in options</a></p>
        </div>
    </div>

    <script>
        // Dedicated Passkey Apps Script Endpoint
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzveongEIbG4QOrrZvR8XE6YmiGJqhAKQbvTXjRmCKeSWDNdlCTf7URC-yrtpYfmq8pXA/exec";

        // Check browser support on load
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.PublicKeyCredential) {
                showcaseAlert("Passkeys are not supported on this browser or device.", "error");
                document.getElementById('auth-btn').disabled = true;
            }
        });

        async function handlePasskeyLogin() {
            const alertBox = document.getElementById('passkey-alert');
            const authBtn = document.getElementById('auth-btn');
            alertBox.style.display = 'none';
            authBtn.disabled = true;
            authBtn.textContent = 'Verifying Passkey...';

            try {
                // 1. Request authentication challenge configuration from backend
                const challengeRes = await fetch(`${SCRIPT_URL}?action=passkey_login_challenge`);
                const options = await challengeRes.json();

                if (!options.success) {
                    throw new Error(options.message || "Failed to initialize passkey challenge.");
                }

                // Convert base64url challenge string into Uint8Array buffer for WebAuthn API
                options.challenge = Uint8Array.from(atob(options.challenge.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                if (options.allowCredentials) {
                    options.allowCredentials.forEach(cred => {
                        cred.id = Uint8Array.from(atob(cred.id.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
                    });
                }

                // 2. Prompt browser / device authenticator (Face ID, Touch ID, Windows Hello)
                const assertion = await navigator.credentials.get({ publicKey: options });

                // 3. Package assertion components to send back for signature verification
                const credentialResponse = {
                    id: assertion.id,
                    rawId: btoa(String.fromCharCode(...new Uint8Array(assertion.rawId))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                    response: {
                        clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(assertion.response.clientDataJSON))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                        authenticatorData: btoa(String.fromCharCode(...new Uint8Array(assertion.response.authenticatorData))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                        signature: btoa(String.fromCharCode(...new Uint8Array(assertion.response.signature))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
                        userHandle: assertion.response.userHandle ? btoa(String.fromCharCode(...new Uint8Array(assertion.response.userHandle))) : null
                    },
                    type: assertion.type
                };

                // 4. Send verification payload to backend
                const verifyRes = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(credentialResponse)
                });
                const result = await verifyRes.json();

                if (result.success) {
                    saveVerifiedEmail(result.email || (result.user && result.user.email) || result.username);
                    localStorage.setItem('foxurl.signin.method', 'passkey');
                    showcaseAlert(`Welcome back, ${result.username || 'User'}! Redirecting...`, "success");
                    setTimeout(() => window.location.href = '/', 1200);
                } else {
                    throw new Error(result.message || "Passkey verification failed.");
                }

            } catch (err) {
                showcaseAlert(err.message || "Passkey operation cancelled or failed.", "error");
                authBtn.disabled = false;
                authBtn.textContent = 'Sign In with Passkey';
            }
        }

        function saveVerifiedEmail(email) {
            if (typeof email === 'string' && email.includes('@')) {
                localStorage.setItem('foxurl.signin.email', email.trim());
            }
        }

        function showcaseAlert(message, type) {
            const alertBox = document.getElementById('passkey-alert');
            alertBox.className = `alert alert-${type === 'success' ? 'success' : 'error'}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';
        }
    </script>
</body>
</html>
