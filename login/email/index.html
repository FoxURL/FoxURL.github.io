<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - FoxURL</title>
    <style>
        :root {
            --bg-color: #101820;
            --card-bg: rgba(22, 32, 38, 0.92);
            --text-main: #f8fafc;
            --text-muted: #a7b2b9;
            --accent: #ff6600;
            --accent-hover: #e65c00;
            --border: rgba(255, 255, 255, 0.12);
            --error: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 12% 10%, rgba(255, 102, 0, 0.18), transparent 30%), linear-gradient(145deg, #101820 0%, #17232a 52%, #0b1115 100%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 42px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 102, 0, 0.08);
            box-sizing: border-box;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 48px;
            height: 48px;
            margin: 0 auto 22px;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-size: 25px;
            font-weight: 900;
            box-shadow: 0 10px 24px rgba(255, 102, 0, 0.25);
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .code-inputs-container {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
        }

        .code-input {
            width: 45px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
        }

        .code-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .alert {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        .hidden {
            display: none !important;
        }

        .footer-actions {
            margin-top: 16px;
            text-align: center;
            font-size: 14px;
        }

        .footer-actions button.link-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            padding: 0;
            font-size: 14px;
            text-decoration: underline;
            width: auto;
        }

        .timer-display {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        @media (max-width: 480px) {
            .auth-container {
                margin: 18px;
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="brand-mark" aria-hidden="true">F</div>
        <!-- Step 1: Email Input Form -->
        <div id="step-email">
            <h2>Sign in to FoxURL</h2>
            <p class="subtitle">Enter your email to receive a secure login code.</p>
            
            <div id="email-alert" class="alert alert-error"></div>

            <form onsubmit="handleSendCode(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <button type="submit" id="send-btn">Send verification code</button>
            </form>
        </div>

        <!-- Step 2: Code Verification Form -->
        <div id="step-code" class="hidden">
            <h2>Enter Verification Code</h2>
            <p class="subtitle">We've sent a 6-digit code to <span id="display-email" style="color: var(--text-main); font-weight: 500;"></span></p>
            
            <div id="code-alert" class="alert alert-error"></div>

            <form onsubmit="handleVerifyCode(event)">
                <div class="code-inputs-container">
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" required>
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
                    <input type="text" maxlength="1" class="code-input" inputmode="numeric" pattern="[0-9]*" required>
                </div>

                <div class="timer-display" id="timer-text">Expires in 05:00</div>

                <button type="submit" id="verify-btn">Verify and sign in</button>
            </form>

            <div class="footer-actions">
                <p>Didn't receive the code? <button type="button" class="link-btn" id="resend-btn" onclick="resendCode()">Resend</button></p>
                <p><button type="button" class="link-btn" onclick="resetToEmailStep()">Use a different email</button></p>
            </div>
        </div>
    </div>

    <script>
        // Latest Google Apps Script Web App Deployment URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQ6IZPgWFkQO5pJzAYzPHvkoi4fgwnt7rwdj5C5YPw9cQWiCw5y94EpLhj6dAAPY_c/exec";
        
        let userEmail = "";
        let clientIp = "Unknown IP";
        let clientLocation = "Unknown Location";
        let clientDevice = parseDeviceInfo();
        let countdownInterval = null;

        // Parse user agent for OS and Browser info
        function parseDeviceInfo() {
            const ua = navigator.userAgent;
            let os = "Unknown OS";
            let browser = "Unknown Browser";

            if (/windows nt/i.test(ua)) os = "Windows";
            else if (/macintosh|mac os x/i.test(ua)) os = "Mac OS";
            else if (/iphone|ipad|ipod/i.test(ua)) os = "iOS";
            else if (/android/i.test(ua)) os = "Android";
            else if (/linux/i.test(ua)) os = "Linux";

            if (/chrome|crios/i.test(ua) && !/edge|opr/i.test(ua)) browser = "Chrome";
            else if (/safari/i.test(ua) && !/chrome|crios/i.test(ua)) browser = "Safari";
            else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
            else if (/edge/i.test(ua)) browser = "Edge";
            else if (/opr|opera/i.test(ua)) browser = "Opera";

            return `${os} / ${browser}`;
        }

        // Fetch user IP and general location via ipapi.co
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data.ip) clientIp = data.ip;
                if (data.city && data.country_name) {
                    clientLocation = `${data.city}, ${data.country_name}`;
                } else if (data.country_name) {
                    clientLocation = data.country_name;
                }
            })
            .catch(() => {
                fetch('https://api.ipify.org?format=json')
                    .then(res => res.json())
                    .then(data => { clientIp = data.ip; })
                    .catch(() => {});
            });

        const codeInputs = document.querySelectorAll('.code-input');
        codeInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                const val = e.target.value;
                if (val && !isNaN(val)) {
                    e.target.value = val.slice(-1);
                    if (index < codeInputs.length - 1) {
                        codeInputs[index + 1].focus();
                    }
                } else {
                    e.target.value = '';
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').trim();
                if (/^\d{6}$/.test(pasteData)) {
                    codeInputs.forEach((inp, idx) => {
                        inp.value = pasteData[idx];
                    });
                    codeInputs[codeInputs.length - 1].focus();
                }
            });
        });

        async function handleSendCode(e) {
            e.preventDefault();
            const emailInput = document.getElementById('email');
            const sendBtn = document.getElementById('send-btn');
            const alertBox = document.getElementById('email-alert');

            userEmail = emailInput.value.trim();
            sendBtn.disabled = true;
            sendBtn.textContent = 'Sending code...';
            alertBox.style.display = 'none';

            // Instant UI transition for smooth speed
            document.getElementById('display-email').textContent = userEmail;
            document.getElementById('step-email').classList.add('hidden');
            document.getElementById('step-code').classList.remove('hidden');
            codeInputs[0].focus();
            startCountdown(300);

            try {
                const url = `${SCRIPT_URL}?action=send_code&email=${encodeURIComponent(userEmail)}&ip=${encodeURIComponent(clientIp)}&location=${encodeURIComponent(clientLocation)}&device=${encodeURIComponent(clientDevice)}`;
                await fetch(url);
            } catch (err) {
                // Handled gracefully in background
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send verification code';
            }
        }

        async function handleVerifyCode(e) {
            e.preventDefault();
            const alertBox = document.getElementById('code-alert');
            const verifyBtn = document.getElementById('verify-btn');

            let codeValue = '';
            codeInputs.forEach(inp => codeValue += inp.value);

            if (codeValue.length !== 6) {
                alertBox.textContent = 'Please enter all 6 digits.';
                alertBox.style.display = 'block';
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            alertBox.style.display = 'none';

            try {
                const url = `${SCRIPT_URL}?action=verify_code&email=${encodeURIComponent(userEmail)}&code=${codeValue}&ip=${encodeURIComponent(clientIp)}&location=${encodeURIComponent(clientLocation)}&device=${encodeURIComponent(clientDevice)}`;
                const apiRes = await fetch(url);
                const textRes = await apiRes.text();
                
                let data;
                try {
                    data = JSON.parse(textRes);
                } catch (parseErr) {
                    data = { success: false, message: "Incorrect verification code. Please check remaining attempts." };
                }

                if (data.success) {
                    saveVerifiedEmail(userEmail);
                    localStorage.setItem('foxurl.signin.method', 'email');
                    localStorage.setItem('foxurl.signin.lastLogin', new Date().toISOString());
                    alertBox.className = 'alert alert-success';
                    alertBox.textContent = 'Sign-in successful! Redirecting...';
                    alertBox.style.display = 'block';
                    clearInterval(countdownInterval);
                    setTimeout(() => {
                        window.location.href = '/'; 
                    }, 1500);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.textContent = data.message || 'Incorrect verification code.';
                    alertBox.style.display = 'block';
                    
                    if (data.locked) {
                        verifyBtn.disabled = true;
                        document.getElementById('resend-btn').disabled = true;
                    } else {
                        // Re-enable button so user can input next attempt
                        verifyBtn.disabled = false;
                        verifyBtn.textContent = 'Verify and sign in';
                    }
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.textContent = 'Incorrect code. Please try again.';
                alertBox.style.display = 'block';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Verify and sign in';
            }
        }

        function saveVerifiedEmail(email) {
            if (typeof email === 'string' && email.includes('@')) {
                localStorage.setItem('foxurl.signin.email', email.trim());
            }
        }

        function startCountdown(durationSeconds) {
            let timer = durationSeconds;
            const timerText = document.getElementById('timer-text');
            
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                let minutes = parseInt(timer / 60, 10);
                let seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                timerText.textContent = `Expires in ${minutes}:${seconds}`;

                if (--timer < 0) {
                    clearInterval(countdownInterval);
                    timerText.textContent = 'Code expired';
                    document.getElementById('verify-btn').disabled = true;
                }
            }, 1000);
        }

        function resendCode() {
            codeInputs.forEach(inp => inp.value = '');
            document.getElementById('code-alert').style.display = 'none';
            handleSendCode({ preventDefault: () => {} });
        }

        function resetToEmailStep() {
            if (countdownInterval) clearInterval(countdownInterval);
            document.getElementById('step-code').classList.add('hidden');
            document.getElementById('step-email').classList.remove('hidden');
            codeInputs.forEach(inp => inp.value = '');
            document.getElementById('code-alert').style.display = 'none';
        }
    </script>
</body>
</html>
