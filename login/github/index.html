<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sign In with GitHub - FoxURL</title>
	<style>
		:root {
			--bg: #101820;
			--card: rgba(22, 32, 38, 0.92);
			--text: #f8fafc;
			--muted: #a7b2b9;
			--accent: #ff6600;
			--border: rgba(255, 255, 255, 0.12);
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			background: radial-gradient(circle at 12% 10%, rgba(255, 102, 0, 0.18), transparent 30%), linear-gradient(145deg, var(--bg), #17232a 52%, #0b1115);
			color: var(--text);
			font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
		}

		.auth-container {
			width: min(400px, calc(100% - 36px));
			box-sizing: border-box;
			padding: 42px;
			border: 1px solid var(--border);
			border-radius: 20px;
			background: var(--card);
			text-align: center;
			box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
		}

		.brand-mark {
			display: grid;
			width: 48px;
			height: 48px;
			margin: 0 auto 22px;
			place-items: center;
			border-radius: 14px;
			background: var(--accent);
			font-size: 25px;
			font-weight: 900;
		}

		h2 { margin: 0 0 8px; }
		.subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

		.github-button {
			display: block;
			width: 100%;
			box-sizing: border-box;
			padding: 12px;
			border-radius: 10px;
			background: #24292f;
			color: #fff;
			font-size: 16px;
			font-weight: 600;
			text-decoration: none;
		}

		.github-button:hover { background: #1b1f23; }

		.back-link { margin-top: 24px; font-size: 14px; }
		.back-link a { color: var(--accent); }

		.status { min-height: 20px; margin: 0 0 16px; color: var(--muted); font-size: 14px; }

		.auth-container {
			border-color: rgba(255, 255, 255, 0.16);
			background: linear-gradient(155deg, rgba(28, 40, 47, 0.97), rgba(15, 23, 28, 0.97));
			backdrop-filter: blur(18px);
		}

		.eyebrow {
			margin: 0 0 10px;
			color: #ffb36b;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0.16em;
			text-transform: uppercase;
		}

		h2 { letter-spacing: -0.035em; }
		.subtitle { line-height: 1.6; }
		.github-button {
			min-height: 50px;
			padding: 15px 12px;
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 12px;
			transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
		}
		.github-button:hover {
			transform: translateY(-2px);
			box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
		}
		.github-button:focus-visible,
		.back-link a:focus-visible {
			outline: 3px solid #ffb36b;
			outline-offset: 3px;
		}
	</style>
	<link rel="stylesheet" href="../auth.css">
</head>
<body>
	<main class="auth-container">
		<a class="brand-mark" href="/" aria-label="FoxURL home">
			<img src="../../assets/logo/logo.png" alt="FoxURL">
		</a>
		<div class="provider-mark provider-mark-github" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.66 1.23 3.3.94.1-.73.4-1.23.72-1.52-2.5-.29-5.13-1.28-5.13-5.57 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.44.11-3 0 0 .95-.3 3.1 1.16a10.8 10.8 0 0 1 5.65 0c2.15-1.46 3.1-1.16 3.1-1.16.61 1.56.23 2.71.11 3 .73.79 1.16 1.8 1.16 3.03 0 4.3-2.63 5.28-5.14 5.56.41.36.77 1.04.77 2.1v3.1c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
		</div>
		<p class="eyebrow">Secure account access</p>
		<h2>Sign in to FoxURL</h2>
		<p class="subtitle">Use your GitHub account to continue.</p>
		<p id="status" class="status" role="status" aria-live="polite"></p>
		<a id="github-button" class="github-button provider-button" href="#">
			<span class="provider-icon provider-icon-github" aria-hidden="true">
				<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.14.68-3.8-1.33-3.8-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.66 1.23 3.3.94.1-.73.4-1.23.72-1.52-2.5-.29-5.13-1.28-5.13-5.57 0-1.23.44-2.24 1.16-3.03-.12-.29-.5-1.44.11-3 0 0 .95-.3 3.1 1.16a10.8 10.8 0 0 1 5.65 0c2.15-1.46 3.1-1.16 3.1-1.16.61 1.56.23 2.71.11 3 .73.79 1.16 1.8 1.16 3.03 0 4.3-2.63 5.28-5.14 5.56.41.36.77 1.04.77 2.1v3.1c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
			</span>
			<span class="provider-label">Continue with GitHub</span>
		</a>
		<div class="back-link"><a href="/login/">Back to sign in options</a></div>
	</main>

	<script>
		// Set these after deploying github-oauth.gs as a Google Apps Script web app.
		const GITHUB_CLIENT_ID = 'Ov23liJbiYCsRKGfhje3';
		const GITHUB_CALLBACK_URL = 'https://script.google.com/macros/s/AKfycbxLvaXG7wDjfCiBDmjJbMiv29ZNmQg9lsnQzAqcEwOA8lohnVCmbuAns_PIxURNynwvJQ/exec';
		const statusText = document.getElementById('status');

		const params = new URLSearchParams(window.location.search);
		const email = params.get('email');
		const name = params.get('name');
		const error = params.get('error');

		if (email) {
			localStorage.setItem('foxurl.signin.email', email);
			localStorage.setItem('foxurl.signin.method', 'github');
			localStorage.setItem('foxurl.signin.lastLogin', new Date().toISOString());
			statusText.textContent = `Welcome, ${name || email}! Redirecting...`;
			setTimeout(() => { window.location.href = '/'; }, 1000);
		} else if (error) {
			statusText.textContent = 'GitHub sign-in was cancelled or could not be completed.';
		}

		const githubButton = document.getElementById('github-button');
		githubButton.href = `https://github.com/login/oauth/authorize?client_id=${encodeURIComponent(GITHUB_CLIENT_ID)}&redirect_uri=${encodeURIComponent(GITHUB_CALLBACK_URL)}&scope=read:user%20user:email`;
	</script>
</body>
</html>
