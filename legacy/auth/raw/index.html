        .btn-google { background-color: #ffffff; color: #444; border: 1px solid #ccc; }
        .btn-github { background-color: #24292e; }
        .btn-discord { background-color: #5865F2; }
        .btn-steam { background-color: #171a21; }
        .btn-spotify { background-color: #1DB954; }
        .btn-custom svg { width: 20px; height: 20px; fill: currentColor; }
        .btn-google svg { fill: #4285F4; }
        h1 { color: #333; }
        p { color: #666; }
