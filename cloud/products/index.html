<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>FoxURL Products</title>
	<style>
		:root { --text: #fff7ef; --muted: #ffe8c9; --orange: #ff7a18; --light: #ffd39a; --line: rgba(255, 200, 140, 0.16); }
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			color: var(--text);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			background: radial-gradient(circle at 12% 0%, rgba(255, 170, 85, 0.2), transparent 28%), radial-gradient(circle at 90% 82%, rgba(255, 125, 35, 0.12), transparent 30%), linear-gradient(180deg, #ffb16f 0%, #ff8a2b 30%, #e85f16 70%, #b9430f 100%);
		}
		.page { width: min(1060px, calc(100% - 40px)); margin: 0 auto; padding: 28px 0 70px; }
		header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
		.brand, .back-link { color: var(--text); text-decoration: none; }
		.brand { font-size: 1.3rem; font-weight: 900; }
		.back-link { padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 0.9rem; }
		.back-link:hover, .back-link:focus-visible { color: var(--text); border-color: var(--light); outline: none; }
		main { padding-top: 72px; }
		.eyebrow { display: inline-block; margin-bottom: 18px; color: var(--light); font-size: 0.78rem; font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; }
		h1 { max-width: 8ch; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3.4rem, 8vw, 6.5rem); font-weight: 500; letter-spacing: -0.06em; line-height: 0.92; }
		.intro { max-width: 560px; margin: 24px 0 0; color: var(--muted); font-size: 1.08rem; line-height: 1.7; }
		.product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 64px; }
		.product-card { display: flex; min-height: 230px; flex-direction: column; justify-content: space-between; padding: 26px; border: 1px solid rgba(255, 140, 60, 0.24); border-radius: 20px; background: linear-gradient(180deg, rgba(255, 160, 90, 0.16), rgba(255, 140, 60, 0.06)); color: var(--text); text-decoration: none; box-shadow: 0 18px 45px rgba(0, 0, 0, 0.25); transition: transform 220ms ease, border-color 220ms ease; }
		.product-card:hover, .product-card:focus-visible { transform: translateY(-6px); border-color: rgba(255, 211, 154, 0.55); outline: none; }
		.product-name { margin: 0 0 12px; font-size: 1.6rem; font-weight: 900; }
		.product-description { max-width: 270px; margin: 0; color: var(--muted); line-height: 1.6; }
		.product-domain { color: var(--light); font-size: 0.84rem; font-weight: 800; }
		@media (max-width: 520px) { .page { width: min(100% - 32px, 1060px); } main { padding-top: 52px; } }
	</style>
</head>
<body>
	<div class="page">
		<header>
			<a class="brand" href="/">FoxURL</a>
			<a class="back-link" href="/">Back home</a>
		</header>
		<main>
			<div class="eyebrow">FoxURL / products</div>
			<h1>Tools with a clear purpose.</h1>
			<p class="intro">Explore the products built around the FoxURL ecosystem. Each one is designed to stay simple, useful, and easy to come back to.</p>
			<section class="product-grid" aria-label="FoxURL products">
				<a class="product-card" href="https://fxlnk.github.io/">
					<div>
						<h2 class="product-name">FoxLink</h2>
						<p class="product-description">Link shortening made safe, simple, and easy.</p>
					</div>
					<span class="product-domain">fxlnk.github.io</span>
				</a>
			</section>
		</main>
	</div>
</body>
</html>
