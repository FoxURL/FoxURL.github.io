<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home · FoxURL Cloud</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <a class="brand" href="/cloud/home/index.html" aria-label="FoxCLOUD, home">
      <img class="brand-mark" src="/assets/FoxCLOUD.png" alt="" aria-hidden="true">
      <span class="brand-name">Fox<em>CLOUD</em></span>
    </a>

    <div class="new-menu">
      <button class="btn-new" id="newBtn" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        New
      </button>
      <svg class="fox-peek" viewBox="0 0 60 44" aria-hidden="true">
        <path class="fox-peek-ear" d="M10 20 L4 4 L20 14 Z" fill="var(--accent)"/>
        <path class="fox-peek-ear" d="M50 20 L56 4 L40 14 Z" fill="var(--accent)"/>
        <path d="M8 20 C8 8 20 2 30 2 C40 2 52 8 52 20 C52 32 42 34 30 34 C18 34 8 32 8 20 Z" fill="var(--accent)"/>
        <path d="M30 16 C24 16 20 20 20 26 C20 31 25 34 30 34 C35 34 40 31 40 26 C40 20 36 16 30 16 Z" fill="#F9F1E7"/>
        <circle class="fox-peek-eye" cx="24" cy="19" r="2" fill="#20140C"/>
        <circle class="fox-peek-eye" cx="36" cy="19" r="2" fill="#20140C"/>
        <path d="M30 24 L27 27 L33 27 Z" fill="#20140C"/>
      </svg>
      <div class="new-dropdown" id="newDropdown" hidden>
        <button data-action="folder"><svg viewBox="0 0 20 20"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.5 2h7.5A1.5 1.5 0 0 1 18 7.5v8A1.5 1.5 0 0 1 16.5 17h-13A1.5 1.5 0 0 1 2 15.5v-10Z" fill="currentColor"/></svg>New folder</button>
        <span class="dropdown-divider"></span>
        <button data-action="file"><svg viewBox="0 0 20 20"><path d="M5 2.5h6.5L15 6v11.5H5V2.5Z" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M11.5 2.5V6H15" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>File upload</button>
        <button data-action="uploadfolder"><svg viewBox="0 0 20 20"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.5 2h7.5A1.5 1.5 0 0 1 18 7.5v8A1.5 1.5 0 0 1 16.5 17h-13A1.5 1.5 0 0 1 2 15.5v-10Z" fill="currentColor"/><path d="M10 8.5v5M7.7 10.8 10 8.5l2.3 2.3" stroke="var(--sidebar-bg)" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>Folder upload</button>
      </div>
    </div>

    <nav class="nav" aria-label="Cloud sections">
      <a href="/cloud/home/index.html" class="nav-item is-active">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10.5 10 4l7 6.5M5 9v7h4v-4.5h2V16h4V9" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
        Home
        <svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="12.5" r="3.4"/><circle cx="5.2" cy="7.5" r="1.7"/><circle cx="9.2" cy="4.8" r="1.7"/><circle cx="13.4" cy="4.9" r="1.7"/><circle cx="15.6" cy="8.3" r="1.7"/></svg>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l1.5 2h7.5A1.5 1.5 0 0 1 18 7.5v8A1.5 1.5 0 0 1 16.5 17h-13A1.5 1.5 0 0 1 2 15.5v-10Z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
        My Drive
        <svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="12.5" r="3.4"/><circle cx="5.2" cy="7.5" r="1.7"/><circle cx="9.2" cy="4.8" r="1.7"/><circle cx="13.4" cy="4.9" r="1.7"/><circle cx="15.6" cy="8.3" r="1.7"/></svg>
      </a>
      <a href="/cloud/recent/index.html" class="nav-item">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 6v4.3l3 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        Recent
        <svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="12.5" r="3.4"/><circle cx="5.2" cy="7.5" r="1.7"/><circle cx="9.2" cy="4.8" r="1.7"/><circle cx="13.4" cy="4.9" r="1.7"/><circle cx="15.6" cy="8.3" r="1.7"/></svg>
      </a>
      <a href="/cloud/shared/index.html" class="nav-item">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="6" cy="6" r="2.3" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="14.5" cy="5" r="2" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="14.5" cy="15" r="2" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M8 7.2 12.7 5.9M8 8 12.7 14" stroke="currentColor" stroke-width="1.4"/></svg>
        Shared with me
        <svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="12.5" r="3.4"/><circle cx="5.2" cy="7.5" r="1.7"/><circle cx="9.2" cy="4.8" r="1.7"/><circle cx="13.4" cy="4.9" r="1.7"/><circle cx="15.6" cy="8.3" r="1.7"/></svg>
      </a>
      <a href="/cloud/trash/index.html" class="nav-item">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4.6c0-.6.4-1 1-1h2c.6 0 1 .4 1 1V6M5.5 6l.6 9.4c0 .6.5 1 1 1h5.8c.5 0 1-.4 1-1L15.5 6" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        Trash
        <svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="12.5" r="3.4"/><circle cx="5.2" cy="7.5" r="1.7"/><circle cx="9.2" cy="4.8" r="1.7"/><circle cx="13.4" cy="4.9" r="1.7"/><circle cx="15.6" cy="8.3" r="1.7"/></svg>
      </a>
    </nav>

    <div class="storage">
      <div class="storage-label">
        <span>Storage</span>
        <span class="storage-amount">3.4 MB of 5 MB · Free plan</span>
      </div>
      <div class="tail-meter" role="img" aria-label="68 percent of storage used">
        <svg viewBox="0 0 120 40" aria-hidden="true">
          <path class="tail-track" d="M4 34 C 20 6, 60 6, 116 20" stroke-linecap="round" fill="none"/>
          <path class="tail-fill" d="M4 34 C 20 6, 60 6, 116 20" stroke-linecap="round" fill="none"/>
          <g class="tail-tip" transform="translate(116,20)">
            <path d="M-9,-4 C-2,-9 7,-9 10,0 C7,7 -2,7 -9,4 C-11,2 -11,-2 -9,-4 Z" fill="var(--accent-soft)"/>
          </g>
        </svg>
      </div>
      <a href="#" class="storage-cta">Upgrade for more space</a>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <div class="main">

    <header class="topbar">
      <div class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6.2" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="search" placeholder="Search in FoxURL Cloud" aria-label="Search files and folders">
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="View options" id="viewToggle">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1" fill="currentColor"/><rect x="11" y="3" width="6" height="6" rx="1" fill="currentColor"/><rect x="3" y="11" width="6" height="6" rx="1" fill="currentColor"/><rect x="11" y="11" width="6" height="6" rx="1" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10 2.8v2M10 15.2v2M17.2 10h-2M4.8 10h-2M15.1 4.9l-1.4 1.4M6.3 13.7l-1.4 1.4M15.1 15.1l-1.4-1.4M6.3 6.3 4.9 4.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <button class="avatar" aria-label="Account menu">JV</button>
      </div>
    </header>

    <main class="content">

      <section class="quick-access" aria-labelledby="quickHeading">
        <h1 id="quickHeading">Good afternoon, Jana</h1>
        <div class="quick-grid" id="quickGrid"></div>
      </section>

      <section class="folders-section" aria-labelledby="foldersHeading">
        <div class="section-head">
          <h2 id="foldersHeading">Folders</h2>
          <button class="text-link" data-view="mydrive">My Drive <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4.5 5 5.5-5 5.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
        </div>
        <div class="folder-grid" id="folderGrid"></div>
      </section>

      <section class="files-section" aria-labelledby="filesHeading">
        <div class="section-head">
          <h2 id="filesHeading">Files</h2>
          <div class="sort-control">
            <label for="sortSelect" class="sr-only">Sort by</label>
            <select id="sortSelect">
              <option value="modified">Last modified</option>
              <option value="name">Name</option>
              <option value="size">File size</option>
            </select>
          </div>
        </div>

        <table class="file-table" id="fileTable">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Owner</th>
              <th scope="col">Last modified</th>
              <th scope="col">File size</th>
              <th scope="col"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody id="fileTableBody"></tbody>
        </table>
      </section>

    </main>
  </div>
</div>

<div class="context-menu" id="contextMenu" hidden>
  <button data-action="open">Open</button>
  <button data-action="share">Share</button>
  <button data-action="rename">Rename</button>
  <button data-action="download">Download</button>
  <span class="dropdown-divider"></span>
  <button data-action="trash" class="danger">Move to trash</button>
</div>

<script src="script.js"></script>
</body>
</html>
